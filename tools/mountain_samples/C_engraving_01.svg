<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cream background -->
  <rect width="200" height="200" fill="#FEF3C7"/>

  <!-- Sun outline -->
  <circle cx="150" cy="60" r="20" fill="none" stroke="#7C2D12" stroke-width="1.5"/>
  <circle cx="150" cy="60" r="14" fill="none" stroke="#7C2D12" stroke-width="0.8"/>
  <circle cx="150" cy="60" r="8" fill="#C2410C"/>

  <!-- Sun rays -->
  <g stroke="#7C2D12" stroke-width="1.2" stroke-linecap="round">
    <line x1="150" y1="28" x2="150" y2="36"/>
    <line x1="150" y1="84" x2="150" y2="92"/>
    <line x1="118" y1="60" x2="126" y2="60"/>
    <line x1="174" y1="60" x2="182" y2="60"/>
    <line x1="128" y1="38" x2="133" y2="43"/>
    <line x1="167" y1="77" x2="172" y2="82"/>
    <line x1="172" y1="38" x2="167" y2="43"/>
    <line x1="133" y1="77" x2="128" y2="82"/>
  </g>

  <!-- Hill silhouette -->
  <path d="M 0,200 L 0,165 Q 50,120 110,135 Q 160,145 200,120 L 200,200 Z" fill="#7C2D12"/>

  <!-- Hatching on hill (right/lit side simulated by sparser lines) -->
  <g stroke="#FEF3C7" stroke-width="0.6" opacity="0.8">
    <line x1="115" y1="145" x2="135" y2="135"/>
    <line x1="125" y1="155" x2="155" y2="138"/>
    <line x1="140" y1="165" x2="175" y2="142"/>
    <line x1="155" y1="175" x2="190" y2="148"/>
  </g>

  <!-- Adinkra-inspired motif (Gye Nyame simplified) on the hill -->
  <g fill="none" stroke="#FEF3C7" stroke-width="1.2">
    <circle cx="55" cy="170" r="6"/>
    <path d="M 55,164 L 55,176 M 49,170 L 61,170"/>
  </g>

  <!-- Foreground line texture -->
  <g stroke="#3F1D03" stroke-width="0.8" stroke-linecap="round">
    <line x1="5" y1="195" x2="15" y2="195"/>
    <line x1="25" y1="197" x2="40" y2="197"/>
    <line x1="60" y1="194" x2="75" y2="194"/>
    <line x1="95" y1="196" x2="115" y2="196"/>
    <line x1="135" y1="195" x2="155" y2="195"/>
    <line x1="170" y1="197" x2="190" y2="197"/>
  </g>

  <!-- Outline -->
  <path d="M 0,165 Q 50,120 110,135 Q 160,145 200,120" fill="none" stroke="#3F1D03" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
