<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cream background -->
  <rect width="200" height="200" fill="#FEF3C7"/>

  <!-- Decorative border -->
  <rect x="4" y="4" width="192" height="192" fill="none" stroke="#3F1D03" stroke-width="0.8"/>
  <rect x="8" y="8" width="184" height="184" fill="none" stroke="#3F1D03" stroke-width="0.4"/>

  <!-- Sun ring -->
  <circle cx="100" cy="80" r="35" fill="none" stroke="#7C2D12" stroke-width="0.6"/>
  <circle cx="100" cy="80" r="28" fill="none" stroke="#7C2D12" stroke-width="0.5"/>
  <circle cx="100" cy="80" r="20" fill="#C2410C" opacity="0.45"/>

  <!-- Radiating lines from sun -->
  <g stroke="#7C2D12" stroke-width="0.4" opacity="0.7">
    <line x1="100" y1="15" x2="100" y2="40"/>
    <line x1="55" y1="80" x2="62" y2="80"/>
    <line x1="138" y1="80" x2="145" y2="80"/>
    <line x1="65" y1="45" x2="72" y2="52"/>
    <line x1="128" y1="52" x2="135" y2="45"/>
    <line x1="70" y1="35" x2="78" y2="48"/>
    <line x1="122" y1="48" x2="130" y2="35"/>
  </g>

  <!-- Distant ridges (just outlines) -->
  <path d="M 0,200 L 0,145 L 28,130 L 50,145 L 78,125 L 108,140 L 138,120 L 168,138 L 200,128 L 200,200 Z" fill="none" stroke="#7C2D12" stroke-width="1" stroke-linejoin="round"/>

  <!-- Mid range silhouette -->
  <path d="M 0,200 L 0,170 L 35,155 L 60,165 L 90,148 L 130,162 L 175,150 L 200,165 L 200,200 Z" fill="#C2410C"/>
  <path d="M 0,200 L 0,170 L 35,155 L 60,165 L 90,148 L 130,162 L 175,150 L 200,165 L 200,200 Z" fill="none" stroke="#3F1D03" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Kilimanjaro signature flat-top -->
  <path d="M 15,200 L 35,180 L 60,160 L 78,108 L 95,95 L 135,93 L 152,108 L 168,150 L 185,180 L 200,200 Z" fill="#7C2D12"/>

  <!-- Snow cap -->
  <path d="M 78,108 L 95,95 L 135,93 L 152,108 L 145,114 L 130,105 L 115,110 L 100,103 L 88,113 Z" fill="#FEF3C7"/>
  <path d="M 78,108 L 95,95 L 135,93 L 152,108 L 145,114 L 130,105 L 115,110 L 100,103 L 88,113 Z" fill="none" stroke="#1C0701" stroke-width="0.8"/>

  <!-- Snow streaks down -->
  <g stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round">
    <line x1="92" y1="115" x2="95" y2="138"/>
    <line x1="115" y1="115" x2="118" y2="145"/>
    <line x1="138" y1="113" x2="142" y2="140"/>
  </g>

  <!-- Hatching on left dark face -->
  <g stroke="#FEF3C7" stroke-width="0.6" opacity="0.9">
    <line x1="22" y1="195" x2="78" y2="115"/>
    <line x1="35" y1="200" x2="78" y2="130"/>
    <line x1="50" y1="200" x2="78" y2="155"/>
    <line x1="65" y1="200" x2="78" y2="180"/>
  </g>

  <!-- Adinkra-inspired motif: Adinkrahene (concentric) on right slope -->
  <g fill="none" stroke="#FEF3C7" stroke-width="1.1">
    <circle cx="172" cy="175" r="7"/>
    <circle cx="172" cy="175" r="4"/>
    <circle cx="172" cy="175" r="1.5" fill="#FEF3C7"/>
  </g>

  <!-- Gye Nyame motif left base -->
  <g fill="none" stroke="#FEF3C7" stroke-width="1">
    <path d="M 28,180 q 3,-6 8,-6 q 5,0 5,5 q 0,5 -5,5 M 36,179 l 4,3"/>
  </g>

  <!-- Kilimanjaro outline -->
  <path d="M 15,200 L 35,180 L 60,160 L 78,108 L 95,95 L 135,93 L 152,108 L 168,150 L 185,180 L 200,200" fill="none" stroke="#1C0701" stroke-width="2" stroke-linejoin="round"/>

  <!-- Foreground dashes -->
  <g stroke="#3F1D03" stroke-width="1" stroke-linecap="round">
    <line x1="15" y1="195" x2="28" y2="195"/>
    <line x1="40" y1="197" x2="65" y2="197"/>
    <line x1="80" y1="195" x2="115" y2="195"/>
    <line x1="130" y1="197" x2="155" y2="197"/>
    <line x1="170" y1="195" x2="185" y2="195"/>
  </g>
</svg>
