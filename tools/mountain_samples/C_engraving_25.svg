<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cream background -->
  <rect width="200" height="200" fill="#FEF3C7"/>

  <!-- Moon/sun behind peak -->
  <circle cx="115" cy="75" r="22" fill="none" stroke="#7C2D12" stroke-width="1.2"/>
  <circle cx="115" cy="75" r="14" fill="#FCD34D" opacity="0.6"/>

  <!-- Distant ridges -->
  <path d="M 0,200 L 0,150 L 25,135 L 50,148 L 75,128 L 100,142 L 130,125 L 160,145 L 200,135 L 200,200 Z" fill="none" stroke="#7C2D12" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Mid range with hatching -->
  <path d="M 0,200 L 0,175 L 30,160 L 60,170 L 90,155 L 130,168 L 170,158 L 200,170 L 200,200 Z" fill="#FCD34D"/>
  <path d="M 0,200 L 0,175 L 30,160 L 60,170 L 90,155 L 130,168 L 170,158 L 200,170 L 200,200 Z" fill="none" stroke="#7C2D12" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Hatching mid range -->
  <g stroke="#7C2D12" stroke-width="0.5">
    <line x1="10" y1="185" x2="20" y2="178"/>
    <line x1="20" y1="190" x2="35" y2="178"/>
    <line x1="40" y1="188" x2="55" y2="172"/>
    <line x1="100" y1="185" x2="118" y2="170"/>
    <line x1="115" y1="190" x2="135" y2="172"/>
    <line x1="140" y1="188" x2="160" y2="170"/>
    <line x1="170" y1="190" x2="190" y2="175"/>
  </g>

  <!-- Main peak silhouette -->
  <path d="M 25,200 L 115,55 L 200,200 Z" fill="#7C2D12"/>

  <!-- Snow cap -->
  <path d="M 115,55 L 100,85 L 110,80 L 120,88 L 130,82 Z" fill="#FEF3C7"/>
  <path d="M 115,55 L 100,85 L 110,80 L 120,88 L 130,82 Z" fill="none" stroke="#3F1D03" stroke-width="0.8"/>

  <!-- Hatching on dark face (left) -->
  <g stroke="#FEF3C7" stroke-width="0.7" opacity="0.85">
    <line x1="50" y1="190" x2="115" y2="80"/>
    <line x1="60" y1="195" x2="115" y2="105"/>
    <line x1="75" y1="195" x2="115" y2="130"/>
    <line x1="90" y1="195" x2="115" y2="155"/>
  </g>

  <!-- Adinkra-inspired motif on right face -->
  <g fill="none" stroke="#FEF3C7" stroke-width="1.4">
    <path d="M 160,170 L 160,150 M 152,162 L 168,162 M 156,156 L 164,168 M 156,168 L 164,156"/>
  </g>

  <!-- Main peak outline -->
  <path d="M 25,200 L 115,55 L 200,200" fill="none" stroke="#1C0701" stroke-width="2" stroke-linejoin="round"/>

  <!-- Foreground dashes -->
  <g stroke="#3F1D03" stroke-width="0.9" stroke-linecap="round">
    <line x1="5" y1="195" x2="18" y2="195"/>
    <line x1="30" y1="197" x2="50" y2="197"/>
    <line x1="65" y1="195" x2="85" y2="195"/>
    <line x1="100" y1="197" x2="125" y2="197"/>
    <line x1="140" y1="195" x2="165" y2="195"/>
    <line x1="175" y1="197" x2="195" y2="197"/>
  </g>
</svg>
