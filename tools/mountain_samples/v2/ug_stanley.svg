<!-- Mont Stanley — Ouganda, 5109m, plateau. Massif du Rwenzori partagé avec la RDC, deux pics (Margherita + Alexandra), système glaciaire complexe, brumes équatoriales. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><linearGradient id="sky_ug" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E0E7FF"/><stop offset="60%" stop-color="#FED7AA"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#sky_ug)"/>
  <circle cx="160" cy="55" r="14" fill="#FB923C" opacity="0.7"/>

  <!-- Brumes équatoriales -->
  <ellipse cx="100" cy="120" rx="100" ry="7" fill="#FAFAF9" opacity="0.55"/>
  <ellipse cx="50" cy="140" rx="50" ry="4" fill="#FAFAF9" opacity="0.4"/>
  <ellipse cx="160" cy="142" rx="45" ry="4" fill="#FAFAF9" opacity="0.4"/>

  <!-- Massif multi-pics (plus large que Marguerite seul) -->
  <polygon points="20,180 35,130 55,95 75,75 90,55 100,52 110,55 125,75 145,95 165,130 185,180" fill="#3F3F46"/>

  <!-- Facettes -->
  <polygon points="20,180 35,130 55,95 70,140 50,180" fill="#27272A"/>
  <polygon points="55,95 75,75 90,55 80,100" fill="#52525B"/>
  <polygon points="90,55 100,52 110,55 105,80 95,80" fill="#71717A"/>
  <polygon points="110,55 125,75 145,95 130,100" fill="#52525B"/>
  <polygon points="145,95 165,130 185,180 150,180" fill="#71717A"/>

  <!-- Système glaciaire (calotte sommitale) -->
  <polygon points="75,75 90,55 100,52 110,55 125,75 115,82 100,75 90,80 80,82" fill="#FAFAF9"/>
  <polygon points="90,55 100,52 110,55 105,68 95,68" fill="#E7E5E4"/>

  <!-- Deux pics jumeaux (Margherita + Alexandra) -->
  <polygon points="90,55 95,48 100,52" fill="#FAFAF9"/>
  <polygon points="100,52 105,48 110,55" fill="#E7E5E4"/>
  <polygon points="95,48 100,52 105,48 102,50 98,50" fill="#D6D3D1"/>

  <!-- Coulées glaciaires -->
  <polygon points="80,82 85,115 90,95" fill="#FAFAF9" opacity="0.85"/>
  <polygon points="95,80 100,118 105,90" fill="#FAFAF9" opacity="0.8"/>
  <polygon points="115,82 120,115 110,98" fill="#FAFAF9" opacity="0.75"/>
  <polygon points="125,75 130,108 122,90" fill="#FAFAF9" opacity="0.7"/>

  <!-- Lobelia / afroalpin -->
  <polygon points="40,180 55,165 75,175 60,180" fill="#1A2E05"/>
  <polygon points="125,180 145,165 165,175 145,180" fill="#1A2E05"/>

  <!-- Forêt équatoriale -->
  <polygon points="0,200 0,180 60,184 130,182 200,184 200,200" fill="#052e16"/>
  <polygon points="0,200 30,193 80,195 140,192 200,194 200,200" fill="#022c1a"/>
</svg>
