<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- gbaka_conducteur : chauffeur de minibus, casquette GBAKA, moustache, peace sign -->
  <defs>
    <radialGradient id="bgGbaka" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE4A8"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bgGbaka)"/>

  <!-- Chemise ouverte ivoire avec col -->
  <path d="M 110 510 Q 130 380 200 360 L 312 360 Q 382 380 402 510 Z" fill="#FAF3E0" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Col ouvert -->
  <path d="M 200 360 L 240 410 L 256 380 L 272 410 L 312 360" fill="#FAF3E0" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Boutons -->
  <circle cx="256" cy="440" r="4" fill="#1F1A17"/>
  <circle cx="256" cy="475" r="4" fill="#1F1A17"/>

  <!-- Bras avec peace sign à droite -->
  <path d="M 380 410 Q 430 380 440 320 L 460 320 Q 458 280 430 280 Q 400 290 380 350 Z" fill="#A06A3E" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <!-- Main / V-sign (deux doigts) -->
  <ellipse cx="440" cy="260" rx="16" ry="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>
  <rect x="430" y="220" width="9" height="35" rx="4" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>
  <rect x="445" y="218" width="9" height="38" rx="4" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>

  <!-- Cou -->
  <rect x="228" y="335" width="56" height="35" rx="8" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Tête -->
  <ellipse cx="256" cy="240" rx="118" ry="125" fill="#A06A3E" stroke="#1F1A17" stroke-width="5"/>

  <!-- Oreilles -->
  <ellipse cx="140" cy="248" rx="14" ry="22" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="372" cy="248" rx="14" ry="22" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Casquette oversized de travers (rotation visuelle: visière à gauche) -->
  <path d="M 130 195 Q 140 110 256 105 Q 372 110 380 200 Q 360 175 256 175 Q 152 175 130 195 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Visière sur le côté gauche -->
  <path d="M 80 200 Q 110 180 140 195 L 140 215 Q 110 222 80 220 Z" fill="#1F1A17" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <!-- Texte GBAKA en or sur le devant -->
  <rect x="180" y="135" width="152" height="38" rx="6" fill="#3B4B8C" stroke="#1F1A17" stroke-width="3"/>
  <text x="256" y="163" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#F4B942" stroke="#1F1A17" stroke-width="1" text-anchor="middle">GBAKA</text>
  <!-- Bouton casquette -->
  <circle cx="256" cy="115" r="6" fill="#F4B942" stroke="#1F1A17" stroke-width="3"/>

  <!-- Yeux ouverts confiants -->
  <circle cx="215" cy="252" r="14" fill="#FFFFFF" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="217" cy="254" r="7" fill="#1F1A17"/>
  <circle cx="219" cy="251" r="2" fill="#FFFFFF"/>
  <circle cx="297" cy="252" r="14" fill="#FFFFFF" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="299" cy="254" r="7" fill="#1F1A17"/>
  <circle cx="301" cy="251" r="2" fill="#FFFFFF"/>

  <!-- Sourcils joyeux -->
  <path d="M 195 228 Q 215 218 235 228" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>
  <path d="M 277 228 Q 297 218 317 228" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

  <!-- Joues -->
  <ellipse cx="170" cy="295" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="342" cy="295" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>

  <!-- Goutte de sueur bleue sur la joue droite -->
  <path d="M 360 270 Q 350 290 360 305 Q 370 295 365 280 Z" fill="#9FE7FF" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="362" cy="285" r="2" fill="#FFFFFF"/>

  <!-- Nez -->
  <path d="M 256 270 Q 248 290 252 298 Q 256 302 264 300" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

  <!-- Moustache touffue -->
  <path d="M 210 315 Q 230 305 256 312 Q 282 305 302 315 Q 290 332 270 325 Q 256 320 242 325 Q 222 332 210 315 Z" fill="#1F1A17" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sourire confiant sous moustache -->
  <path d="M 226 335 Q 256 355 286 335" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 234 340 Q 256 350 278 340" fill="#FFFFFF"/>

  <!-- Mini gbaka jaune-noir en bas à droite -->
  <g transform="translate(380 470)">
    <rect x="-40" y="-25" width="80" height="30" rx="4" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
    <rect x="-40" y="-15" width="80" height="6" fill="#1F1A17"/>
    <rect x="-32" y="-22" width="16" height="8" fill="#9FE7FF" stroke="#1F1A17" stroke-width="2"/>
    <rect x="-12" y="-22" width="16" height="8" fill="#9FE7FF" stroke="#1F1A17" stroke-width="2"/>
    <rect x="8" y="-22" width="16" height="8" fill="#9FE7FF" stroke="#1F1A17" stroke-width="2"/>
    <circle cx="-25" cy="8" r="7" fill="#1F1A17" stroke="#1F1A17" stroke-width="2"/>
    <circle cx="25" cy="8" r="7" fill="#1F1A17" stroke="#1F1A17" stroke-width="2"/>
    <circle cx="-25" cy="8" r="3" fill="#FAF3E0"/>
    <circle cx="25" cy="8" r="3" fill="#FAF3E0"/>
  </g>
</svg>
