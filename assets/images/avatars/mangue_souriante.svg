<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- mangue_souriante : mangue juteuse, deux tons, mains en cœur -->
  <defs>
    <radialGradient id="bg6" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE3B8"/>
      <stop offset="100%" stop-color="#E54F3B" stop-opacity="0.0"/>
    </radialGradient>
    <clipPath id="mangoClip">
      <path d="M 145 230 Q 130 130 230 110 Q 350 95 380 220 Q 395 360 290 415 Q 175 425 145 230 Z"/>
    </clipPath>
  </defs>
  <!-- Halo de fond doux -->
  <circle cx="256" cy="256" r="230" fill="url(#bg6)"/>

  <!-- Petite feuille au sommet (cowlick) -->
  <path d="M 240 110 Q 220 70 250 60 Q 270 80 260 115 Z" fill="#4A8B3E" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 248 75 L 254 105" stroke="#1F1A17" stroke-width="2"/>

  <!-- Corps de la mangue (ovale incliné), couleur de base (côté jaune) -->
  <path d="M 145 230 Q 130 130 230 110 Q 350 95 380 220 Q 395 360 290 415 Q 175 425 145 230 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Côté rouge/orange (séparation nette diagonale via clip) -->
  <g clip-path="url(#mangoClip)">
    <path d="M 280 80 L 420 200 L 420 440 L 200 460 Z" fill="#E54F3B"/>
  </g>

  <!-- Ligne diagonale de séparation -->
  <path d="M 285 100 Q 250 260 220 425" fill="none" stroke="#1F1A17" stroke-width="3" opacity="0.4"/>

  <!-- Petits points texture -->
  <circle cx="190" cy="220" r="2.5" fill="#7A4E2B" opacity="0.5"/>
  <circle cx="210" cy="290" r="2.5" fill="#7A4E2B" opacity="0.5"/>
  <circle cx="195" cy="350" r="2.5" fill="#7A4E2B" opacity="0.5"/>
  <circle cx="330" cy="200" r="2.5" fill="#7A4E2B" opacity="0.4"/>
  <circle cx="340" cy="280" r="2.5" fill="#7A4E2B" opacity="0.4"/>
  <circle cx="320" cy="350" r="2.5" fill="#7A4E2B" opacity="0.4"/>

  <!-- Bras / mains en forme de cœur (deux petites courbes "C" se rencontrant en haut) -->
  <line x1="180" y1="200" x2="215" y2="160" stroke="#7A4E2B" stroke-width="5" stroke-linecap="round"/>
  <line x1="335" y1="195" x2="300" y2="155" stroke="#7A4E2B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 215 160 Q 200 140 215 130 Q 230 125 240 145 Q 248 132 256 132" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>
  <path d="M 300 160 Q 315 140 300 130 Q 285 125 275 145 Q 267 132 256 132" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>
  <!-- Petit cœur dans le creux des mains -->
  <path d="M 256 152 Q 248 142 240 148 Q 235 158 256 170 Q 277 158 272 148 Q 264 142 256 152 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Yeux fermés joyeux (arcs vers le haut) -->
  <path d="M 200 260 Q 215 245 230 260" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 282 260 Q 297 245 312 260" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Joues blush -->
  <ellipse cx="190" cy="310" rx="13" ry="8" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="322" cy="310" rx="13" ry="8" fill="#E58A8A" opacity="0.55"/>

  <!-- Grand sourire -->
  <path d="M 222 320 Q 256 360 290 320" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Petite langue rose -->
  <path d="M 246 340 Q 256 352 266 340 Q 256 346 246 340 Z" fill="#E58A8A" stroke="#1F1A17" stroke-width="2"/>
</svg>
