<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- piment_furieux : petit piment rouge en colère, vapeur, poings serrés -->
  <defs>
    <radialGradient id="bg8" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFD4C2"/>
      <stop offset="100%" stop-color="#E54F3B" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- Halo de fond doux -->
  <circle cx="256" cy="256" r="230" fill="url(#bg8)"/>

  <!-- Vapeur côté gauche -->
  <path d="M 110 220 Q 95 200 110 185 Q 130 195 125 215 Q 140 220 130 235 Q 115 240 110 220 Z" fill="#FAF3E0" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 85 280 Q 70 265 85 250 Q 105 258 100 275 Q 115 280 105 295 Q 90 300 85 280 Z" fill="#E0DDD3" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round" opacity="0.75"/>
  <!-- Vapeur côté droit -->
  <path d="M 402 220 Q 417 200 402 185 Q 382 195 387 215 Q 372 220 382 235 Q 397 240 402 220 Z" fill="#FAF3E0" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 427 280 Q 442 265 427 250 Q 407 258 412 275 Q 397 280 407 295 Q 422 300 427 280 Z" fill="#E0DDD3" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round" opacity="0.75"/>

  <!-- Tige verte au sommet -->
  <path d="M 244 120 Q 220 80 230 60 Q 250 75 256 110 Q 262 75 282 60 Q 292 80 268 120 Z" fill="#4A8B3E" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <line x1="256" y1="75" x2="256" y2="115" stroke="#1F1A17" stroke-width="2"/>

  <!-- Corps du piment (forme courbée) -->
  <path d="M 220 115 Q 180 180 175 280 Q 180 380 250 430 Q 320 410 335 320 Q 345 220 320 150 Q 300 110 270 110 Q 245 110 220 115 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Ombre côté droit plus sombre -->
  <path d="M 280 130 Q 320 200 325 290 Q 320 380 270 420 Q 310 405 322 320 Q 335 230 315 160 Q 305 130 280 130 Z" fill="#A8331F" opacity="0.7"/>

  <!-- Petites lignes fissures (chaleur) -->
  <path d="M 210 200 L 220 210 L 215 225 L 225 235" fill="none" stroke="#7A2618" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200 300 L 212 310 L 205 325" fill="none" stroke="#7A2618" stroke-width="3" stroke-linecap="round"/>
  <path d="M 290 270 L 300 280 L 295 295 L 305 305" fill="none" stroke="#7A2618" stroke-width="3" stroke-linecap="round"/>
  <path d="M 260 360 L 272 370 L 267 385" fill="none" stroke="#7A2618" stroke-width="3" stroke-linecap="round"/>

  <!-- Sourcils en V (colère) -->
  <path d="M 195 195 L 235 215" stroke="#1F1A17" stroke-width="6" stroke-linecap="round"/>
  <path d="M 305 195 L 265 215" stroke="#1F1A17" stroke-width="6" stroke-linecap="round"/>

  <!-- Yeux gros, blanc avec petites pupilles en colère -->
  <circle cx="222" cy="240" r="16" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="278" cy="240" r="16" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="224" cy="243" r="6" fill="#1F1A17"/>
  <circle cx="280" cy="243" r="6" fill="#1F1A17"/>
  <circle cx="226" cy="241" r="2" fill="#FFFFFF"/>
  <circle cx="282" cy="241" r="2" fill="#FFFFFF"/>

  <!-- Joues kawai (petites) -->
  <ellipse cx="195" cy="285" rx="9" ry="5" fill="#E58A8A" opacity="0.5"/>
  <ellipse cx="305" cy="285" rx="9" ry="5" fill="#E58A8A" opacity="0.5"/>

  <!-- Petite bouche fâchée (carrée) -->
  <path d="M 240 295 Q 250 308 260 295 Q 270 308 280 295" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bras gauche poing serré -->
  <line x1="180" y1="290" x2="145" y2="265" stroke="#A8331F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="140" cy="260" r="14" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 132 258 L 148 258" stroke="#1F1A17" stroke-width="2"/>
  <path d="M 132 263 L 148 263" stroke="#1F1A17" stroke-width="2"/>

  <!-- Bras droit poing serré -->
  <line x1="335" y1="290" x2="370" y2="265" stroke="#A8331F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="375" cy="260" r="14" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 367 258 L 383 258" stroke="#1F1A17" stroke-width="2"/>
  <path d="M 367 263 L 383 263" stroke="#1F1A17" stroke-width="2"/>

  <!-- Petites marques d'éclats de colère -->
  <path d="M 130 200 L 140 195 L 135 185" fill="none" stroke="#F4B942" stroke-width="3" stroke-linecap="round"/>
  <path d="M 380 200 L 370 195 L 375 185" fill="none" stroke="#F4B942" stroke-width="3" stroke-linecap="round"/>
</svg>
