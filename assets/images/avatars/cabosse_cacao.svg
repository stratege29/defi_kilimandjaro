<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- cabosse_cacao : cabosse de cacao mûre, kawai, pouce levé -->
  <defs>
    <radialGradient id="bg5" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE3B8"/>
      <stop offset="100%" stop-color="#D97742" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- Halo de fond doux -->
  <circle cx="256" cy="256" r="230" fill="url(#bg5)"/>

  <!-- Tige + feuille verte au sommet -->
  <path d="M 256 110 L 256 80" stroke="#4A8B3E" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 95 Q 220 80 210 60 Q 230 60 245 80 Z" fill="#4A8B3E" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 256 95 Q 292 80 302 60 Q 282 60 267 80 Z" fill="#5B7A3E" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 224 70 L 235 80" stroke="#1F1A17" stroke-width="2"/>

  <!-- Jambes en bas (sandales) -->
  <line x1="220" y1="430" x2="220" y2="475" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <line x1="292" y1="430" x2="292" y2="475" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="220" cy="482" rx="18" ry="8" fill="#7A4E2B" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="292" cy="482" rx="18" ry="8" fill="#7A4E2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Bras gauche (en bas, naturel) -->
  <line x1="160" y1="290" x2="125" y2="330" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="335" r="10" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>

  <!-- Bras droit levé pouce en haut -->
  <line x1="352" y1="270" x2="390" y2="200" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(390 195)">
    <circle cx="0" cy="0" r="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>
    <path d="M -3 -2 L -3 -18 Q 4 -22 6 -14 L 6 -2 Z" fill="#A06A3E" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Corps de la cabosse (forme ovale verticale) -->
  <ellipse cx="256" cy="290" rx="110" ry="150" fill="#F4B942" stroke="#1F1A17" stroke-width="5"/>

  <!-- Ombre côté droit -->
  <path d="M 256 145 Q 332 160 360 290 Q 332 420 256 430 Q 310 410 330 290 Q 310 175 256 145 Z" fill="#D97742" opacity="0.7"/>

  <!-- Crêtes verticales -->
  <path d="M 256 150 Q 250 290 256 425" fill="none" stroke="#7A4E2B" stroke-width="3" opacity="0.6"/>
  <path d="M 210 160 Q 195 290 215 420" fill="none" stroke="#7A4E2B" stroke-width="3" opacity="0.6"/>
  <path d="M 302 160 Q 317 290 297 420" fill="none" stroke="#7A4E2B" stroke-width="3" opacity="0.6"/>
  <path d="M 175 185 Q 165 290 180 395" fill="none" stroke="#7A4E2B" stroke-width="3" opacity="0.5"/>
  <path d="M 337 185 Q 347 290 332 395" fill="none" stroke="#7A4E2B" stroke-width="3" opacity="0.5"/>

  <!-- Fente / ouverture avec fèves blanches visibles -->
  <path d="M 200 230 Q 256 215 312 230 Q 290 285 256 290 Q 222 285 200 230 Z" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="225" cy="255" rx="9" ry="7" fill="#FAF3E0" stroke="#7A4E2B" stroke-width="2"/>
  <ellipse cx="245" cy="265" rx="9" ry="7" fill="#FAF3E0" stroke="#7A4E2B" stroke-width="2"/>
  <ellipse cx="266" cy="265" rx="9" ry="7" fill="#FAF3E0" stroke="#7A4E2B" stroke-width="2"/>
  <ellipse cx="287" cy="255" rx="9" ry="7" fill="#FAF3E0" stroke="#7A4E2B" stroke-width="2"/>

  <!-- Yeux qui jettent un œil par la fente (au dessus) -->
  <circle cx="220" cy="215" r="12" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="292" cy="215" r="12" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="222" cy="217" r="6" fill="#1F1A17"/>
  <circle cx="294" cy="217" r="6" fill="#1F1A17"/>
  <circle cx="225" cy="214" r="2" fill="#FFFFFF"/>
  <circle cx="297" cy="214" r="2" fill="#FFFFFF"/>

  <!-- Grand sourire kawai sous la fente -->
  <path d="M 215 340 Q 256 380 297 340" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Joues kawai -->
  <ellipse cx="180" cy="335" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="332" cy="335" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>
</svg>
