<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- masque_baoule_lune : masque Kplekple, ovale lunaire, or et bois -->
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFF4D6"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- Halo de fond doux -->
  <circle cx="256" cy="256" r="230" fill="url(#bg2)"/>

  <!-- Lunes flottantes décoratives -->
  <path d="M 80 150 Q 92 140 100 155 Q 92 152 88 162 Q 80 158 80 150 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="3"/>
  <path d="M 420 180 Q 432 170 440 185 Q 432 182 428 192 Q 420 188 420 180 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="3"/>
  <path d="M 70 360 Q 82 350 90 365 Q 82 362 78 372 Q 70 368 70 360 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="3"/>
  <path d="M 425 380 Q 437 370 445 385 Q 437 382 433 392 Q 425 388 425 380 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="3"/>

  <!-- Petites étoiles -->
  <circle cx="120" cy="240" r="3" fill="#F4B942"/>
  <circle cx="400" cy="280" r="3" fill="#F4B942"/>
  <circle cx="140" cy="420" r="3" fill="#F4B942"/>

  <!-- Ombre douce sous le masque (flottant) -->
  <ellipse cx="256" cy="470" rx="100" ry="14" fill="#1F1A17" opacity="0.15"/>

  <!-- Visage ovale allongé (lune) - moitié supérieure or -->
  <path d="M 256 90 Q 366 110 366 250 L 146 250 Q 146 110 256 90 Z" fill="#F4B942" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Moitié inférieure bois sombre -->
  <path d="M 146 250 L 366 250 Q 366 390 256 410 Q 146 390 146 250 Z" fill="#7A4E2B" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Contour global du masque pour bien fermer -->
  <ellipse cx="256" cy="250" rx="110" ry="160" fill="none" stroke="#1F1A17" stroke-width="5"/>

  <!-- Ligne de séparation médiane -->
  <line x1="146" y1="250" x2="366" y2="250" stroke="#1F1A17" stroke-width="4"/>

  <!-- Scarifications géométriques verticales sur le front -->
  <line x1="240" y1="130" x2="240" y2="160" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="125" x2="256" y2="160" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="130" x2="272" y2="160" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- Scarifications sur les joues -->
  <line x1="180" y1="300" x2="180" y2="320" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="305" x2="195" y2="325" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <line x1="317" y1="305" x2="317" y2="325" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <line x1="332" y1="300" x2="332" y2="320" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- Yeux fermés en arc -->
  <path d="M 200 225 Q 215 215 230 225" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 282 225 Q 297 215 312 225" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Nez fin géométrique -->
  <path d="M 256 245 L 250 285 L 262 285 Z" fill="#5A3A1B" stroke="#1F1A17" stroke-width="3"/>

  <!-- Petit sourire crescent vers le haut -->
  <path d="M 226 335 Q 256 320 286 335" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Joues kawai (petites) -->
  <ellipse cx="190" cy="335" rx="10" ry="6" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="322" cy="335" rx="10" ry="6" fill="#E58A8A" opacity="0.55"/>

  <!-- Petit croissant doré au sommet du front -->
  <path d="M 250 105 Q 262 95 270 110 Q 262 107 258 115 Q 250 112 250 105 Z" fill="#FAF3E0" stroke="#1F1A17" stroke-width="3"/>
</svg>
