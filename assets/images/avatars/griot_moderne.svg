<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- griot_moderne : jeune griot hip-hop, casque rose-jaune, lunettes, kora électrique -->
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFD1E8"/>
      <stop offset="100%" stop-color="#3B4B8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="koraGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FE7FF"/>
      <stop offset="100%" stop-color="#3B4B8C"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bg2)"/>

  <!-- Corps : hoodie violet -->
  <path d="M 110 480 Q 256 360 402 480 L 402 512 L 110 512 Z" fill="#7B3FBF" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Chaîne avec pendentif calebasse -->
  <path d="M 220 380 Q 256 410 292 380" fill="none" stroke="#F4B942" stroke-width="4"/>
  <circle cx="256" cy="418" r="18" fill="#D97742" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 244 418 Q 256 410 268 418" stroke="#7A4E2B" stroke-width="2" fill="none"/>

  <!-- Cou -->
  <rect x="228" y="335" width="56" height="35" rx="8" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Tête -->
  <ellipse cx="256" cy="240" rx="118" ry="125" fill="#A06A3E" stroke="#1F1A17" stroke-width="5"/>

  <!-- Coiffure fade afro -->
  <path d="M 140 195 Q 150 130 256 120 Q 362 130 372 195 Q 350 180 256 175 Q 162 180 140 195 Z" fill="#1F1A17" stroke="#1F1A17" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="200" cy="160" r="4" fill="#3D2A1F"/>
  <circle cx="256" cy="148" r="4" fill="#3D2A1F"/>
  <circle cx="312" cy="160" r="4" fill="#3D2A1F"/>

  <!-- Casque audio rose/jaune -->
  <path d="M 130 215 Q 130 150 256 145 Q 382 150 382 215" fill="none" stroke="#F4B942" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="130" cy="240" rx="30" ry="38" fill="#FF6FAA" stroke="#1F1A17" stroke-width="5"/>
  <ellipse cx="382" cy="240" rx="30" ry="38" fill="#FF6FAA" stroke="#1F1A17" stroke-width="5"/>
  <ellipse cx="130" cy="240" rx="15" ry="22" fill="#F4B942"/>
  <ellipse cx="382" cy="240" rx="15" ry="22" fill="#F4B942"/>

  <!-- Lunettes rondes oversized -->
  <circle cx="208" cy="250" r="38" fill="#1F1A17" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="304" cy="250" r="38" fill="#1F1A17" stroke="#1F1A17" stroke-width="4"/>
  <line x1="246" y1="250" x2="266" y2="250" stroke="#1F1A17" stroke-width="5"/>
  <!-- Reflets -->
  <ellipse cx="195" cy="238" rx="10" ry="6" fill="#9FE7FF" opacity="0.8"/>
  <ellipse cx="291" cy="238" rx="10" ry="6" fill="#9FE7FF" opacity="0.8"/>

  <!-- Joues -->
  <ellipse cx="175" cy="295" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="337" cy="295" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>

  <!-- Sourire confiant -->
  <path d="M 226 320 Q 256 345 286 320" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 234 325 Q 256 335 278 325" fill="#FFFFFF"/>

  <!-- Kora électrique flottante en bas droite -->
  <g transform="translate(390 380)">
    <ellipse cx="0" cy="20" rx="32" ry="36" fill="url(#koraGlow)" stroke="#1F1A17" stroke-width="4"/>
    <path d="M -22 5 L -22 -55" stroke="#1F1A17" stroke-width="4"/>
    <path d="M -16 -8 L -16 -55" stroke="#9FE7FF" stroke-width="2"/>
    <path d="M -10 -8 L -10 -55" stroke="#9FE7FF" stroke-width="2"/>
    <path d="M -4 -8 L -4 -55" stroke="#9FE7FF" stroke-width="2"/>
    <!-- Glow sparkle -->
    <circle cx="-20" cy="-30" r="2" fill="#FFFFFF"/>
    <circle cx="-8" cy="-50" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Notes électro -->
  <text x="70" y="180" font-family="Arial" font-size="36" fill="#FF6FAA" stroke="#1F1A17" stroke-width="1.5">♪</text>
  <text x="55" y="280" font-family="Arial" font-size="28" fill="#F4B942" stroke="#1F1A17" stroke-width="1">♬</text>
</svg>
