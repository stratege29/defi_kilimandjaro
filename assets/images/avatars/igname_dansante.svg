<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- igname_dansante : igname anthropomorphe qui danse, terre qui vole -->
  <defs>
    <radialGradient id="bg7" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F2D8B0"/>
      <stop offset="100%" stop-color="#7A4E2B" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <!-- Halo de fond doux -->
  <circle cx="256" cy="256" r="230" fill="url(#bg7)"/>

  <!-- Particules de terre qui volent -->
  <circle cx="100" cy="280" r="6" fill="#5A3A1B"/>
  <circle cx="115" cy="320" r="4" fill="#7A4E2B"/>
  <circle cx="90" cy="360" r="5" fill="#5A3A1B"/>
  <circle cx="130" cy="400" r="3" fill="#7A4E2B"/>
  <circle cx="410" cy="290" r="6" fill="#5A3A1B"/>
  <circle cx="395" cy="340" r="4" fill="#7A4E2B"/>
  <circle cx="420" cy="380" r="5" fill="#5A3A1B"/>
  <circle cx="385" cy="420" r="3" fill="#7A4E2B"/>
  <path d="M 105 290 L 95 295" stroke="#5A3A1B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 405 300 L 415 305" stroke="#5A3A1B" stroke-width="3" stroke-linecap="round"/>

  <!-- Bras gauche levé -->
  <line x1="195" y1="200" x2="155" y2="155" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="150" cy="148" r="11" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>

  <!-- Bras droit levé -->
  <line x1="315" y1="200" x2="358" y2="160" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="363" cy="153" r="11" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>

  <!-- Corps du tubercule (forme irrégulière, vertical) -->
  <path d="M 220 120 Q 200 130 195 175 Q 175 220 185 270 Q 195 330 210 380 Q 220 415 250 425 Q 290 420 300 380 Q 320 330 325 270 Q 335 220 318 175 Q 312 130 290 120 Q 270 110 250 110 Q 232 112 220 120 Z" fill="#8B5A2B" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Taches/mouchetures plus sombres -->
  <ellipse cx="220" cy="200" rx="8" ry="5" fill="#5A3A1B" opacity="0.7"/>
  <ellipse cx="290" cy="230" rx="7" ry="4" fill="#5A3A1B" opacity="0.7"/>
  <ellipse cx="210" cy="290" rx="9" ry="5" fill="#5A3A1B" opacity="0.7"/>
  <ellipse cx="295" cy="320" rx="6" ry="4" fill="#5A3A1B" opacity="0.7"/>
  <ellipse cx="240" cy="370" rx="7" ry="4" fill="#5A3A1B" opacity="0.7"/>
  <ellipse cx="280" cy="180" rx="5" ry="3" fill="#5A3A1B" opacity="0.7"/>
  <circle cx="265" cy="395" r="3" fill="#5A3A1B" opacity="0.7"/>
  <circle cx="230" cy="245" r="3" fill="#5A3A1B" opacity="0.7"/>

  <!-- Petites bosses (silhouette irrégulière) -->
  <path d="M 195 240 Q 178 245 185 260" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <path d="M 325 290 Q 340 290 330 308" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- Jambe gauche (droite) -->
  <line x1="240" y1="420" x2="225" y2="465" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>
  <!-- Jambe droite (pliée mid-dance) -->
  <line x1="275" y1="420" x2="305" y2="445" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>
  <line x1="305" y1="445" x2="290" y2="475" stroke="#8B5A2B" stroke-width="7" stroke-linecap="round"/>

  <!-- Sandales tan -->
  <ellipse cx="222" cy="478" rx="18" ry="7" fill="#D4B889" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="288" cy="485" rx="18" ry="7" fill="#D4B889" stroke="#1F1A17" stroke-width="4"/>

  <!-- Sourcils joyeux (relevés) -->
  <path d="M 215 165 Q 228 155 240 162" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>
  <path d="M 272 162 Q 285 155 297 165" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

  <!-- Yeux ouverts -->
  <circle cx="227" cy="190" r="12" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="285" cy="190" r="12" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="229" cy="192" r="6" fill="#1F1A17"/>
  <circle cx="287" cy="192" r="6" fill="#1F1A17"/>
  <circle cx="232" cy="189" r="2" fill="#FFFFFF"/>
  <circle cx="290" cy="189" r="2" fill="#FFFFFF"/>

  <!-- Joues kawai -->
  <ellipse cx="205" cy="225" rx="10" ry="6" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="307" cy="225" rx="10" ry="6" fill="#E58A8A" opacity="0.55"/>

  <!-- Petite bouche souriante -->
  <path d="M 240 230 Q 256 248 272 230" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
</svg>
