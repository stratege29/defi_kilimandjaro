<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- vendeuse_attieke : femme de marché, calebasse d'attiéké sur la tête, pagne wax -->
  <defs>
    <radialGradient id="bgAttieke" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE9C9"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
    <pattern id="waxAttieke" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#F4B942"/>
      <path d="M 0 20 L 20 0 L 40 20 L 20 40 Z" fill="#3B4B8C"/>
      <circle cx="20" cy="20" r="4" fill="#F4B942"/>
    </pattern>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bgAttieke)"/>

  <!-- Corps : pagne wax avec motif -->
  <path d="M 110 510 Q 130 390 256 380 Q 382 390 402 510 Z" fill="url(#waxAttieke)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Bordure d'encolure -->
  <path d="M 200 395 Q 256 415 312 395" fill="none" stroke="#1F1A17" stroke-width="4"/>

  <!-- Bras en kimbo (mains sur les hanches) -->
  <path d="M 110 510 Q 80 460 100 410 Q 130 400 150 430 L 160 510 Z" fill="url(#waxAttieke)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 402 510 Q 432 460 412 410 Q 382 400 362 430 L 352 510 Z" fill="url(#waxAttieke)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Mains sur les hanches -->
  <ellipse cx="155" cy="440" rx="16" ry="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="357" cy="440" rx="16" ry="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>

  <!-- Cou -->
  <rect x="228" y="350" width="56" height="35" rx="8" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Tête -->
  <ellipse cx="256" cy="250" rx="115" ry="122" fill="#A06A3E" stroke="#1F1A17" stroke-width="5"/>

  <!-- Oreilles avec boucles dorées -->
  <ellipse cx="143" cy="258" rx="14" ry="22" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="369" cy="258" rx="14" ry="22" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="138" cy="285" r="14" fill="none" stroke="#F4B942" stroke-width="5"/>
  <circle cx="374" cy="285" r="14" fill="none" stroke="#F4B942" stroke-width="5"/>

  <!-- Foulard noué haut -->
  <path d="M 145 195 Q 155 150 256 145 Q 357 150 367 195 Q 350 175 256 175 Q 162 175 145 195 Z" fill="url(#waxAttieke)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Noeud haut -->
  <path d="M 220 130 Q 240 90 256 100 Q 272 90 292 130 Q 280 140 256 135 Q 232 140 220 130 Z" fill="url(#waxAttieke)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="125" r="6" fill="#F4B942" stroke="#1F1A17" stroke-width="2"/>

  <!-- Calebasse géante sur le foulard -->
  <ellipse cx="256" cy="80" rx="120" ry="32" fill="#D97742" stroke="#1F1A17" stroke-width="5"/>
  <ellipse cx="256" cy="70" rx="110" ry="22" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <!-- Grains d'attiéké (points blancs/jaunes) -->
  <circle cx="180" cy="68" r="3" fill="#F4B942"/>
  <circle cx="200" cy="62" r="3" fill="#FAF3E0"/>
  <circle cx="218" cy="70" r="3" fill="#F4B942"/>
  <circle cx="236" cy="60" r="3" fill="#FAF3E0"/>
  <circle cx="252" cy="68" r="3" fill="#F4B942"/>
  <circle cx="268" cy="62" r="3" fill="#FAF3E0"/>
  <circle cx="286" cy="70" r="3" fill="#F4B942"/>
  <circle cx="304" cy="62" r="3" fill="#FAF3E0"/>
  <circle cx="322" cy="68" r="3" fill="#F4B942"/>
  <circle cx="195" cy="76" r="2.5" fill="#F4B942"/>
  <circle cx="225" cy="78" r="2.5" fill="#FAF3E0"/>
  <circle cx="260" cy="76" r="2.5" fill="#F4B942"/>
  <circle cx="295" cy="78" r="2.5" fill="#FAF3E0"/>
  <circle cx="325" cy="76" r="2.5" fill="#F4B942"/>

  <!-- Yeux fermés en joie (sourire éclatant) -->
  <path d="M 200 258 Q 215 245 230 258" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 282 258 Q 297 245 312 258" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Joues -->
  <ellipse cx="170" cy="305" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="342" cy="305" rx="14" ry="9" fill="#E58A8A" opacity="0.55"/>

  <!-- Nez -->
  <path d="M 256 275 Q 248 295 252 305 Q 256 310 264 307" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

  <!-- Grand sourire éclatant avec dents -->
  <path d="M 220 330 Q 256 365 292 330" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>
  <path d="M 226 334 Q 256 358 286 334 Z" fill="#FFFFFF" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <line x1="256" y1="335" x2="256" y2="352" stroke="#1F1A17" stroke-width="2"/>
</svg>
