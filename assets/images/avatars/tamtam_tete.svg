<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- tamtam_tete : djembe character with crossed mallets -->
  <defs>
    <radialGradient id="bgTam" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FCD9B8"/>
      <stop offset="100%" stop-color="#D97742" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bgTam)"/>

  <!-- Djembe drum body (hourglass) -->
  <path d="M 160 180 Q 150 290 200 360 Q 210 430 230 470 L 282 470 Q 302 430 312 360 Q 362 290 352 180 Z" fill="#D97742" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Wood texture lines -->
  <path d="M 175 220 Q 170 290 210 360" fill="none" stroke="#A85820" stroke-width="3" stroke-linecap="round"/>
  <path d="M 256 215 L 256 365" stroke="#A85820" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 337 220 Q 342 290 302 360" fill="none" stroke="#A85820" stroke-width="3" stroke-linecap="round"/>

  <!-- Rope lacing zigzag on upper drum -->
  <path d="M 162 195 L 180 215 L 200 195 L 220 215 L 240 195 L 260 215 L 280 195 L 300 215 L 320 195 L 340 215 L 352 195" fill="none" stroke="#FAF3E0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165 235 L 185 255 L 205 235 L 225 255 L 245 235 L 265 255 L 285 235 L 305 255 L 325 235 L 345 255 L 350 245" fill="none" stroke="#FAF3E0" stroke-width="3" stroke-linecap="round"/>

  <!-- Vertical ropes -->
  <line x1="180" y1="195" x2="185" y2="255" stroke="#FAF3E0" stroke-width="2"/>
  <line x1="220" y1="195" x2="225" y2="255" stroke="#FAF3E0" stroke-width="2"/>
  <line x1="260" y1="195" x2="265" y2="255" stroke="#FAF3E0" stroke-width="2"/>
  <line x1="300" y1="195" x2="305" y2="255" stroke="#FAF3E0" stroke-width="2"/>
  <line x1="340" y1="195" x2="345" y2="255" stroke="#FAF3E0" stroke-width="2"/>

  <!-- Leather drumhead (face) -->
  <ellipse cx="256" cy="180" rx="100" ry="30" fill="#FAF3E0" stroke="#1F1A17" stroke-width="5"/>
  <ellipse cx="256" cy="175" rx="90" ry="22" fill="none" stroke="#E0D8B8" stroke-width="2"/>

  <!-- Cymbal-like eyes -->
  <circle cx="222" cy="175" r="14" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="222" cy="175" r="7" fill="none" stroke="#A87A1F" stroke-width="2"/>
  <circle cx="222" cy="175" r="3" fill="#1F1A17"/>
  <circle cx="290" cy="175" r="14" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="290" cy="175" r="7" fill="none" stroke="#A87A1F" stroke-width="2"/>
  <circle cx="290" cy="175" r="3" fill="#1F1A17"/>

  <!-- Blush -->
  <ellipse cx="200" cy="190" rx="10" ry="5" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="312" cy="190" rx="10" ry="5" fill="#E58A8A" opacity="0.55"/>

  <!-- Cute smile -->
  <path d="M 240 195 Q 256 205 272 195" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round"/>

  <!-- Arms (thin) holding mallets crossed -->
  <path d="M 175 290 Q 145 320 175 380" fill="none" stroke="#7A4E2B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 337 290 Q 367 320 337 380" fill="none" stroke="#7A4E2B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 290 Q 145 320 175 380" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <path d="M 337 290 Q 367 320 337 380" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- Tiny hands -->
  <circle cx="178" cy="378" r="11" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>
  <circle cx="334" cy="378" r="11" fill="#A06A3E" stroke="#1F1A17" stroke-width="3"/>

  <!-- Crossed mallets (wooden sticks with ball ends) -->
  <line x1="180" y1="378" x2="340" y2="430" stroke="#7A4E2B" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="378" x2="340" y2="430" stroke="#1F1A17" stroke-width="2" stroke-linecap="round"/>
  <line x1="332" y1="378" x2="172" y2="430" stroke="#7A4E2B" stroke-width="8" stroke-linecap="round"/>
  <line x1="332" y1="378" x2="172" y2="430" stroke="#1F1A17" stroke-width="2" stroke-linecap="round"/>
  <!-- Mallet heads -->
  <circle cx="340" cy="430" r="14" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="172" cy="430" r="14" fill="#FAF3E0" stroke="#1F1A17" stroke-width="4"/>

  <!-- Musical notes -->
  <text x="78" y="180" font-family="Arial" font-size="30" fill="#F4B942" stroke="#1F1A17" stroke-width="1.5">♪</text>
  <text x="410" y="200" font-family="Arial" font-size="26" fill="#3B4B8C" stroke="#1F1A17" stroke-width="1">♫</text>
</svg>
