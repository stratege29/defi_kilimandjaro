<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- balafon_baby : tiny balafon character with mallets -->
  <defs>
    <radialGradient id="bgBal" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE4C2"/>
      <stop offset="100%" stop-color="#7A4E2B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bgBal)"/>

  <!-- Frame supports -->
  <rect x="100" y="250" width="14" height="12" fill="#7A4E2B" stroke="#1F1A17" stroke-width="3"/>
  <rect x="398" y="250" width="14" height="12" fill="#7A4E2B" stroke="#1F1A17" stroke-width="3"/>

  <!-- Wooden bars (7 of varying lengths) -->
  <rect x="118" y="240" width="40" height="80" rx="6" fill="#7A4E2B" stroke="#1F1A17" stroke-width="4"/>
  <rect x="166" y="245" width="40" height="75" rx="6" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>
  <rect x="214" y="250" width="40" height="70" rx="6" fill="#7A4E2B" stroke="#1F1A17" stroke-width="4"/>
  <rect x="262" y="255" width="40" height="65" rx="6" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>
  <rect x="310" y="260" width="40" height="60" rx="6" fill="#7A4E2B" stroke="#1F1A17" stroke-width="4"/>
  <rect x="358" y="265" width="40" height="55" rx="6" fill="#8B5A2B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Wood grain -->
  <line x1="138" y1="260" x2="138" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>
  <line x1="186" y1="265" x2="186" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>
  <line x1="234" y1="270" x2="234" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>
  <line x1="282" y1="275" x2="282" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="280" x2="330" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>
  <line x1="378" y1="285" x2="378" y2="310" stroke="#5A3A1B" stroke-width="2" opacity="0.5"/>

  <!-- Calabash gourd resonators hanging below -->
  <ellipse cx="138" cy="370" rx="22" ry="30" fill="#D97742" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="186" cy="375" rx="22" ry="32" fill="#D97742" stroke="#1F1A17" stroke-width="4"/>
  <!-- Front-center gourds as eyes -->
  <ellipse cx="234" cy="380" rx="24" ry="34" fill="#E89556" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="282" cy="380" rx="24" ry="34" fill="#E89556" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="330" cy="375" rx="22" ry="32" fill="#D97742" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="378" cy="370" rx="22" ry="30" fill="#D97742" stroke="#1F1A17" stroke-width="4"/>

  <!-- Eye whites and pupils on center gourds -->
  <circle cx="234" cy="375" r="11" fill="#FFFFFF" stroke="#1F1A17" stroke-width="3"/>
  <circle cx="234" cy="377" r="6" fill="#1F1A17"/>
  <circle cx="236" cy="375" r="2" fill="#FFFFFF"/>
  <circle cx="282" cy="375" r="11" fill="#FFFFFF" stroke="#1F1A17" stroke-width="3"/>
  <circle cx="282" cy="377" r="6" fill="#1F1A17"/>
  <circle cx="284" cy="375" r="2" fill="#FFFFFF"/>

  <!-- Blush -->
  <ellipse cx="222" cy="395" rx="8" ry="5" fill="#E58A8A" opacity="0.55"/>
  <ellipse cx="294" cy="395" rx="8" ry="5" fill="#E58A8A" opacity="0.55"/>

  <!-- Small mouth between central gourds -->
  <path d="M 248 408 Q 258 416 268 408" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny arms above body holding mallets -->
  <path d="M 200 225 Q 180 180 195 150" fill="none" stroke="#A06A3E" stroke-width="8" stroke-linecap="round"/>
  <path d="M 200 225 Q 180 180 195 150" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>
  <path d="M 316 225 Q 336 180 321 150" fill="none" stroke="#A06A3E" stroke-width="8" stroke-linecap="round"/>
  <path d="M 316 225 Q 336 180 321 150" fill="none" stroke="#1F1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- Mallets -->
  <line x1="195" y1="150" x2="180" y2="110" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <line x1="195" y1="150" x2="180" y2="110" stroke="#1F1A17" stroke-width="2" stroke-linecap="round"/>
  <circle cx="178" cy="108" r="10" fill="#FAF3E0" stroke="#1F1A17" stroke-width="3"/>

  <line x1="321" y1="150" x2="336" y2="110" stroke="#7A4E2B" stroke-width="6" stroke-linecap="round"/>
  <line x1="321" y1="150" x2="336" y2="110" stroke="#1F1A17" stroke-width="2" stroke-linecap="round"/>
  <circle cx="338" cy="108" r="10" fill="#FAF3E0" stroke="#1F1A17" stroke-width="3"/>

  <!-- Floating musical notes -->
  <text x="70" y="180" font-family="Arial" font-size="30" fill="#F4B942" stroke="#1F1A17" stroke-width="1.5">♪</text>
  <text x="420" y="200" font-family="Arial" font-size="26" fill="#F4B942" stroke="#1F1A17" stroke-width="1">♫</text>
  <text x="90" y="430" font-family="Arial" font-size="24" fill="#F4B942" stroke="#1F1A17" stroke-width="1">♪</text>
  <text x="410" y="430" font-family="Arial" font-size="24" fill="#F4B942" stroke="#1F1A17" stroke-width="1">♬</text>
</svg>
