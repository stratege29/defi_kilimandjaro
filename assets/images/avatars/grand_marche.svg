  <path d="M 138 393 Q 145 388 152 393" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="195" cy="410" r="22" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 188 393 Q 195 388 202 393" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="245" cy="410" r="22" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="295" cy="410" r="22" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 288 393 Q 295 388 302 393" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="345" cy="410" r="22" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <!-- Reflets tomates -->
  <ellipse cx="138" cy="403" rx="5" ry="3" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="238" cy="403" rx="5" ry="3" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="338" cy="403" rx="5" ry="3" fill="#FFFFFF" opacity="0.7"/>

