  <path d="M 100 440 Q 110 432 120 440" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="165" cy="455" rx="28" ry="24" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 155 440 Q 165 432 175 440" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="220" cy="455" rx="28" ry="24" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="275" cy="455" rx="28" ry="24" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 265 440 Q 275 432 285 440" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="330" cy="455" rx="28" ry="24" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="385" cy="455" rx="28" ry="24" fill="#F4B942" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 375 440 Q 385 432 395 440" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
