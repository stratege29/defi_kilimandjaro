<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- grand_marche : commerçante derrière une pyramide de fruits -->
  <defs>
    <radialGradient id="bgMarche" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE4A8"/>
      <stop offset="100%" stop-color="#E54F3B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="waxMarche" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#E54F3B"/>
      <circle cx="18" cy="18" r="6" fill="#F4B942"/>
      <path d="M 0 18 L 18 0 L 36 18 L 18 36 Z" fill="none" stroke="#3B4B8C" stroke-width="2"/>
    </pattern>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#bgMarche)"/>

  <!-- Foulard wax de la commerçante (au-dessus de la pyramide) -->
  <path d="M 155 195 Q 165 130 256 122 Q 347 130 357 195 Q 340 175 256 175 Q 172 175 155 195 Z" fill="url(#waxMarche)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- Noeud du foulard -->
  <path d="M 220 135 Q 240 100 256 110 Q 272 100 292 135 Q 280 145 256 142 Q 232 145 220 135 Z" fill="url(#waxMarche)" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="128" r="5" fill="#F4B942" stroke="#1F1A17" stroke-width="2"/>

  <!-- Petite tête (front visible sous le foulard) -->
  <path d="M 155 195 Q 256 215 357 195 L 357 240 Q 256 250 155 240 Z" fill="#A06A3E" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Yeux ouverts surpris/joyeux -->
  <circle cx="215" cy="225" r="16" fill="#FFFFFF" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="217" cy="228" r="8" fill="#1F1A17"/>
  <circle cx="219" cy="225" r="3" fill="#FFFFFF"/>
  <circle cx="297" cy="225" r="16" fill="#FFFFFF" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="299" cy="228" r="8" fill="#1F1A17"/>
  <circle cx="301" cy="225" r="3" fill="#FFFFFF"/>

  <!-- Sourcils relevés (surprise heureuse) -->
  <path d="M 195 205 Q 215 195 235 207" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>
  <path d="M 277 207 Q 297 195 317 205" fill="none" stroke="#1F1A17" stroke-width="4" stroke-linecap="round"/>

