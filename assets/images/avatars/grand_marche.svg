  <circle cx="180" cy="370" r="20" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 173 354 Q 180 350 187 354" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="225" cy="370" r="20" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <circle cx="270" cy="370" r="20" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>
  <path d="M 263 354 Q 270 350 277 354" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="315" cy="370" r="20" fill="#E54F3B" stroke="#1F1A17" stroke-width="4"/>

  <!-- Rangée 4 : piments rouges (allongés) -->
  <path d="M 210 340 Q 215 325 218 318 Q 220 315 222 320 Q 220 335 215 345 Q 210 348 210 340 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 218 318 Q 219 315 222 314" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 240 342 Q 246 327 248 320 Q 252 316 252 322 Q 250 337 246 347 Q 240 350 240 342 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 248 320 Q 250 316 253 316" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 270 340 Q 275 325 278 318 Q 281 315 282 320 Q 280 335 275 345 Q 270 348 270 340 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 278 318 Q 280 315 283 314" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 298 342 Q 304 327 306 320 Q 310 316 310 322 Q 308 337 304 347 Q 298 350 298 342 Z" fill="#E54F3B" stroke="#1F1A17" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 306 320 Q 308 316 311 316" fill="none" stroke="#4A8B3E" stroke-width="3" stroke-linecap="round"/>

  <!-- Mains de la commerçante qui dépassent (petites) -->
  <ellipse cx="135" cy="345" rx="16" ry="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>
  <ellipse cx="377" cy="345" rx="16" ry="14" fill="#A06A3E" stroke="#1F1A17" stroke-width="4"/>
</svg>
