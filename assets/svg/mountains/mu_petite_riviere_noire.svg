<!-- Piton Petite Rivière Noire — Maurice, 828m, cone
     Pic volcanique aigu en basalte sombre, profil pyramidal très reconnaissable,
     végétation tropicale dense, océan en arrière-plan. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Distant clouds -->
  <ellipse cx="40" cy="40" rx="22" ry="4" fill="#FEF3C7" opacity="0.8"/>
  <ellipse cx="115" cy="35" rx="18" ry="3" fill="#FEF3C7" opacity="0.7"/>

  <!-- Ocean horizon -->
  <rect y="150" width="200" height="20" fill="#0EA5E9"/>
  <polygon points="0,150 200,150 200,153 0,153" fill="#38BDF8"/>

  <!-- Distant smaller peaks (Trois Mamelles silhouette suggérée) -->

  <!-- Main piton: sharp triangular volcanic peak -->
  <!-- Base shadow -->
  <polygon points="55,180 110,55 165,180" fill="#0F172A"/>
  <!-- Dark left face -->
  <polygon points="55,180 110,55 110,180" fill="#1E293B"/>
  <!-- Mid-left facet -->
  <polygon points="110,55 100,110 80,140 65,170" fill="#334155"/>
  <!-- Lit right facet (sun side) -->
  <polygon points="110,55 130,100 145,150 160,180 110,180" fill="#475569"/>
  <!-- Sharp right edge highlight -->
  <polygon points="110,55 125,90 130,100" fill="#64748B"/>
  <!-- Subtle ridge -->
  <polygon points="110,55 110,180 100,170 95,140 100,110" fill="#1E293B"/>

  <!-- Tropical vegetation on lower slopes -->
  <polygon points="55,180 60,170 70,178 75,165 85,178 90,170 100,180" fill="#166534"/>
  <polygon points="110,180 120,170 130,176 138,165 148,178 158,170 165,180" fill="#15803D"/>

  <!-- Foreground vegetation -->
  <polygon points="0,200 0,182 35,188 70,184 110,190 150,184 200,188 200,200" fill="#14532D"/>
  <!-- Palm tree silhouettes -->
  <g fill="#052e16">
    <line x1="25" y1="195" x2="25" y2="178" stroke="#052e16" stroke-width="1.5"/>
    <path d="M 25,178 q -8,-2 -10,2 M 25,178 q 8,-2 10,2 M 25,178 q -4,-5 -2,-9 M 25,178 q 4,-5 2,-9"/>
    <line x1="180" y1="195" x2="180" y2="180" stroke="#052e16" stroke-width="1.3"/>
    <path d="M 180,180 q -6,-1 -8,2 M 180,180 q 6,-1 8,2 M 180,180 q -3,-4 -1,-7 M 180,180 q 3,-4 1,-7"/>
  </g>

  <!-- Sand strip -->
  <polygon points="0,200 0,195 60,197 130,196 200,197 200,200" fill="#FDE68A"/>
</svg>
