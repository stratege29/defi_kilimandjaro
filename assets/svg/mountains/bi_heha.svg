<!-- Mont Heha — Burundi, 2670m, dome. Plus haut sommet du Burundi sur les hauts plateaux, dôme verdoyant, brumes fréquentes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Brumes des hauts plateaux -->
  <ellipse cx="50" cy="118" rx="35" ry="5" fill="#FAFAF9" opacity="0.55"/>
  <ellipse cx="155" cy="128" rx="35" ry="4" fill="#FAFAF9" opacity="0.5"/>

  <!-- Distant ridges -->

  <!-- Dôme verdoyant -->
  <polygon points="15,180 30,130 60,98 100,82 145,95 175,128 188,180" fill="#3F6212"/>
  <polygon points="15,180 30,130 60,98 80,130 65,180" fill="#1A2E05"/>
  <polygon points="60,98 100,82 95,128 80,130" fill="#4D7C0F"/>
  <polygon points="100,82 145,95 135,128 95,128" fill="#65A30D"/>
  <polygon points="145,95 175,128 188,180 145,180" fill="#84CC16"/>
  <polygon points="80,130 95,128 135,128 130,180 65,180" fill="#4D7C0F"/>
  <polygon points="95,128 135,128 130,180 105,158" fill="#65A30D"/>
  <polygon points="100,82 115,90 105,98" fill="#A3E635"/>

  <!-- Terrasses agricoles (signature des hauts plateaux burundais) -->
  <line x1="40" y1="160" x2="180" y2="160" stroke="#365314" stroke-width="0.5" opacity="0.7"/>
  <line x1="45" y1="170" x2="175" y2="170" stroke="#365314" stroke-width="0.5" opacity="0.7"/>

  <!-- Foreground -->
  <polygon points="0,200 0,182 60,186 130,184 200,186 200,200" fill="#1A2E05"/>
  <polygon points="0,200 30,193 80,195 140,192 200,194 200,200" fill="#052e16"/>
</svg>
