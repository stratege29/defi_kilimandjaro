<!-- Monte Binga — Mozambique, 2436m, dome. Plus haut sommet du Mozambique, massif Chimanimani à la frontière du Zimbabwe. Quartzite, prairies. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Dôme de quartzite -->
  <polygon points="15,180 30,130 60,100 100,82 145,95 175,128 188,180" fill="#854D0E"/>
  <polygon points="15,180 30,130 60,100 80,135 65,180" fill="#5C2410"/>
  <polygon points="60,100 100,82 95,130 80,135" fill="#92400E"/>
  <polygon points="100,82 145,95 135,128 95,130" fill="#A16207"/>
  <polygon points="145,95 175,128 188,180 145,180" fill="#B45309"/>
  <polygon points="80,135 95,130 135,128 130,180 65,180" fill="#92400E"/>
  <polygon points="95,130 135,128 130,180 100,160" fill="#A16207"/>

  <!-- Affleurements de quartzite blanc-jaune (signature Chimanimani) -->
  <polygon points="100,82 115,90 105,98" fill="#FDE68A"/>
  <polygon points="115,90 135,93 125,100" fill="#FCD34D"/>

  <!-- Prairies sur les versants -->
  <polygon points="55,160 65,150 75,160" fill="#65A30D"/>
  <polygon points="140,160 150,150 160,160" fill="#65A30D"/>

  <!-- Foreground -->
  <polygon points="0,200 0,182 60,186 130,184 200,186 200,200" fill="#365314"/>
  <polygon points="0,200 30,195 80,196 140,194 200,195 200,200" fill="#1A2E05"/>
</svg>
