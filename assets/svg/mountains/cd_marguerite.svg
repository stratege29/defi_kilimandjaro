<!-- Pic Marguerite — RD Congo, 5109m, dent. Sommet le plus haut du Rwenzori "Montagnes de la Lune", glaciers tropicaux, pic aigu enveloppé de brume permanente. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Brumes du Rwenzori (signature "Montagnes de la Lune") -->
  <ellipse cx="100" cy="110" rx="100" ry="8" fill="#FAFAF9" opacity="0.55"/>
  <ellipse cx="60" cy="130" rx="60" ry="5" fill="#FAFAF9" opacity="0.4"/>
  <ellipse cx="155" cy="135" rx="50" ry="4" fill="#FAFAF9" opacity="0.35"/>

  <!-- Pic aigu (forme "dent") -->
  <polygon points="45,180 100,45 155,180" fill="#3F3F46"/>
  <polygon points="45,180 100,45 100,180" fill="#27272A"/>
  <polygon points="100,45 90,100 75,155 60,180" fill="#52525B"/>
  <polygon points="100,45 115,100 130,155 145,180 100,180" fill="#71717A"/>
  <polygon points="100,45 110,80 115,100" fill="#A1A1AA"/>

  <!-- Glacier tropical sommital (signature unique) -->
  <polygon points="100,45 92,80 78,115 90,118 100,90 110,118 122,115 108,80" fill="#FAFAF9"/>
  <polygon points="100,45 95,68 100,90 105,68" fill="#E7E5E4"/>
  <polygon points="78,115 90,118 85,125" fill="#FAFAF9"/>
  <polygon points="108,80 122,115 115,125 95,125 100,90" fill="#FAFAF9" opacity="0.85"/>

  <!-- Coulées glaciaires -->
  <polygon points="78,115 85,140 90,125" fill="#FAFAF9" opacity="0.8"/>

  <!-- Lobelia / séneçon géant (étage afroalpin) -->
  <polygon points="45,180 60,165 80,175 60,180" fill="#1A2E05"/>
  <polygon points="120,180 140,165 155,180 140,180" fill="#1A2E05"/>

  <!-- Forêt équatoriale base -->
  <polygon points="0,200 0,180 60,184 130,182 200,184 200,200" fill="#052e16"/>
  <polygon points="0,200 30,193 80,195 140,192 200,194 200,200" fill="#022c1a"/>
</svg>
