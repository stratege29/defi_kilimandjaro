<!-- Jebel Marra — Soudan, 3042m, cone. Massif volcanique du Darfour, caldeira de Deriba avec lac de cratère, savane semi-aride. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Distant petits cônes volcaniques -->

  <!-- Stratovolcan avec caldeira sommitale (Deriba) -->
  <polygon points="25,180 80,100 95,90 130,90 145,100 195,180" fill="#7C2D12"/>

  <!-- Caldeira (sommet plat avec dépression) -->
  <polygon points="80,100 95,90 130,90 145,100 130,108 95,108" fill="#92400E"/>
  <!-- Lac de cratère (vert turquoise, signature Deriba) -->
  <ellipse cx="112" cy="102" rx="14" ry="3" fill="#0E7490"/>
  <ellipse cx="112" cy="101" rx="10" ry="1.5" fill="#0891B2"/>

  <!-- Lèvre de caldeira -->
  <polygon points="80,100 95,90 130,90 145,100 138,104 95,104" fill="#A16207"/>

  <!-- Face droite éclairée -->
  <polygon points="130,90 145,100 195,180 165,180" fill="#A16207"/>
  <polygon points="145,100 195,180 175,160" fill="#B45309"/>

  <!-- Face gauche sombre -->
  <polygon points="25,180 80,100 95,90 100,180" fill="#5C2410"/>
  <polygon points="80,100 95,90 90,150" fill="#7C2D12"/>

  <!-- Coulée de lave ancienne -->
  <polygon points="100,150 110,170 90,175" fill="#451A03"/>
  <polygon points="125,150 140,170 115,170" fill="#451A03"/>

  <!-- Savane sèche -->
  <polygon points="0,200 0,180 60,184 130,182 200,184 200,200" fill="#CA8A04"/>
  <polygon points="0,200 30,193 80,195 140,192 200,194 200,200" fill="#854D0E"/>
  <line x1="35" y1="195" x2="35" y2="186" stroke="#1C0701" stroke-width="0.8"/>
  <ellipse cx="35" cy="184" rx="4" ry="1.5" fill="#1C0701"/>
  <line x1="170" y1="195" x2="170" y2="186" stroke="#1C0701" stroke-width="0.8"/>
  <ellipse cx="170" cy="184" rx="4" ry="1.5" fill="#1C0701"/>
</svg>
