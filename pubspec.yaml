name: defi_kilimandjaro
description: "Word Connect culturel africain — Sagesse Ivoirienne"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1
  flutter: '>=3.38.0'

dependencies:
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_database: ^12.3.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_soloud: ^3.5.4
  flutter_svg: ^2.0.16
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.2.3
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.5.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.3
  app_links: ^6.3.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  mockito: ^5.4.4
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/data/devinettes/
    - assets/data/i18n/
    - assets/svg/
    - assets/images/brand/
    - assets/images/mascot/
    - assets/images/tiles/
    - assets/images/buttons/
    - assets/images/icons/
    - assets/images/backgrounds/
    - assets/images/mountains/
    - assets/images/devinettes/
    - assets/images/ornaments/
    - assets/images/fx/
    - assets/images/badges/
    - assets/images/shop/
    - assets/images/duel/

# ----------------------------------------------------------------------------
# App icon (run: dart run flutter_launcher_icons)
# ----------------------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/brand/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A3A20"
  adaptive_icon_foreground: "assets/images/brand/app_icon.png"

# ----------------------------------------------------------------------------
# Native splash (run: dart run flutter_native_splash:create)
# ----------------------------------------------------------------------------
flutter_native_splash:
  color: "#1A3A20"
  image: assets/images/brand/logo_k.png
  android_12:
    color: "#1A3A20"
    image: assets/images/brand/logo_k.png
  ios_content_mode: center
  fullscreen: true
