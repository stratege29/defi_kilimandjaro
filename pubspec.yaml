name: defi_kilimandjaro
description: "Word Connect culturel africain — Sagesse Ivoirienne"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1
  flutter: '>=3.38.0'

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_soloud: ^3.5.4
  flutter_svg: ^2.0.16
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.5.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  mockito: ^5.4.4
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
